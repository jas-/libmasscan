name: CI

on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install libpcap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # The submodule commit must match the "masscan.commit" pin in package.json.
      - run: node scripts/fetch-masscan.js --check

      # Compiles masscan and the module.
      - run: npm install

      # The tests use masscan --offline mode, so they send no packets and need no root.
      - run: npm test
